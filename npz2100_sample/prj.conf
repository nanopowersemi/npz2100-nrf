# sample/prj.conf
# ----------------
# Kconfig for the nPZ2100 sample on nRF52833 / NCS 3.0.2.
#
# No GPIO or interrupt configuration is required.
# The nPZ2100 controls the nRF52833 power supply directly via SW_HP.
# Every nRF52833 boot is caused by the nPZ2100 re-enabling the host switch.

# I²C subsystem (required by the driver)
CONFIG_I2C=y

# nPZ2100 driver
# Auto-selected when DT_HAS_NANOPOWER_NPZ2100_ENABLED is set, but listed
# explicitly here for clarity.
CONFIG_NPZ2100=y
CONFIG_NPZ2100_INIT_PRIORITY=80

# Driver logging (0=OFF 1=ERR 2=WRN 3=INF 4=DBG)
CONFIG_LOG=y
CONFIG_NPZ2100_LOG_LEVEL_INF=y
